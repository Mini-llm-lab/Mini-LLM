[project]
name = "mini-llm"
version = "0.1.0"
description = "Small decoder-only language model trained end-to-end with PyTorch: BPE tokenizer, pretraining, SFT, chat, and Hugging Face export"
readme = "README.md"
authors = [
    { name = "Mini-LLM Lab" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=0.23",
    "numpy>=2.4.6",
    "safetensors>=0.4",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "transformers>=4.40",
]

[project.scripts]
prep = "mini_llm.prep:main"
pretrain = "mini_llm.pretrain:main"
teacher = "mini_llm.teacher:main"
sft = "mini_llm.sft:main"
chat = "mini_llm.chat:main"
export = "mini_llm.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
